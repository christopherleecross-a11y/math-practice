<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Cross — Practice</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #dedbd2;
    --accent: #1f5fa8; --accent-soft: #e6eef8; --good: #2f7a32; --good-soft: #e7f3e4;
    --bad: #b03a2e; --bad-soft: #fbe9e6; --warn: #8a5a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  header h1 { font-size: 24px; margin: 0 0 4px; font-weight: 650; }
  header p { margin: 0; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 18px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  select, input[type=text], input[type=password] { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  button { font: inherit; cursor: pointer; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 11px 20px; font-weight: 600; margin-top: 18px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .err { color: var(--bad); font-size: 14px; margin-top: 8px; min-height: 1em; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 12px; margin-top: 16px; }
  .qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .qnum { font-weight: 700; }
  .qtopic { font-size: 13px; color: var(--muted); }
  canvas { display: block; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .diagram { margin: 10px 0 4px; }
  .drawwrap { position: relative; margin: 10px 0 4px; }
  .drawwrap > canvas.base { width: 100%; height: auto; }
  .drawwrap > canvas.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .drawwrap.on > canvas.layer { pointer-events: auto; touch-action: none; cursor: crosshair; }
  .drawwrap.on { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 4px; }
  .drawbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 2px; }
  .drawbar button { font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .drawbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .drawbar .dot { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .drawbar .dot.picked { box-shadow: 0 0 0 2px var(--ink); }
  .drawbar .tools { display: none; gap: 8px; align-items: center; }
  .checkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .checkbtn { margin: 0; padding: 8px 18px; }
  .flash { flex-basis: 100%; color: var(--warn); background: #fdf3dc; border-radius: 8px; padding: 8px 12px; font-size: 15px; }
  .work { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .worktoggle { display: inline-flex; align-items: center; gap: 4px; font: 600 14px system-ui, sans-serif; color: var(--accent); background: #fff; border: 1px dashed var(--accent); border-radius: 8px; padding: 7px 14px; }
  .worktoggle.open { border-style: solid; margin-bottom: 10px; }
  .worktoggle .chev { font-size: 12px; }
  .workhas { margin-left: 8px; font-weight: 600; color: var(--good); background: var(--good-soft); border-radius: 99px; padding: 1px 8px; font-size: 12px; }
  .worktitle { font-weight: 700; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .work textarea { width: 100%; margin-top: 8px; padding: 10px 12px; font: 16px system-ui, sans-serif; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .mkeys { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .mkeys button { min-width: 36px; padding: 5px 8px; font: 16px Georgia, serif; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  .mkeys button:hover { border-color: var(--accent); }
  .mkeys .mtext { font: 13px system-ui, sans-serif; }
  .anskeys { margin-top: 8px; }
  .anskeys button { min-width: 34px; padding: 3px 7px; font-size: 15px; }
  math-field.mans { display: inline-block; min-width: 96px; min-height: 40px; padding: 2px 8px; font-size: 20px; border: 1px solid var(--line); border-radius: 8px; background: #fff; vertical-align: middle; }
  math-field.mans.wide { min-width: 260px; }
  .proof .pline { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .proof .plabel { width: 40px; text-align: right; font: 600 15px Georgia, serif; color: var(--muted, #666); }
  .proof .pfield { flex: 1; min-width: 220px; max-width: 560px; }
  .proof .pmark { width: 18px; font-weight: 700; } .proof .pmark.ok { color: #2e7d32; } .proof .pmark.bad { color: #c0392b; }
  .proof .pmsg { flex-basis: 100%; margin-left: 48px; font: 13px system-ui, sans-serif; color: #c0392b; }
  .proof .pnote { margin-top: 6px; }
  .aifb { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: #eef4fb; border: 1px solid #c9daf0; font: 15px/1.45 system-ui, sans-serif; }
  input.expr { min-width: 240px; font: 18px Georgia, serif; }
  math-field.mans:focus-within { border-color: var(--accent); }
  math-field.mans[read-only] { background: #f3f1ec; }
  .mrow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  math-field.mline { flex: 1; min-height: 42px; padding: 4px 8px; font-size: 20px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  math-field.mline:focus-within { border-color: var(--accent); outline: none; }
  math-field.ro { display: block; border: none; background: #faf9f6; margin-bottom: 4px; }
  math-field::part(menu-toggle) { display: none; }
  .mdel { border: none; background: none; color: var(--muted); font-size: 20px; padding: 2px 6px; }
  .madd { font-size: 14px; padding: 6px 12px; border: 1px dashed var(--line); border-radius: 8px; background: #fff; color: var(--accent); }
  .typedwork { white-space: pre-wrap; margin-top: 8px; padding: 10px 12px; background: #faf9f6; border-radius: 8px; font-size: 15px; }
  .drawbar.on .tools { display: flex; }
  .choices { display: grid; gap: 8px; margin-top: 12px; }
  .choice { display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--ink); }
  .choice:hover { border-color: var(--accent); }
  .choice.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .choice.right { border-color: var(--good); background: var(--good-soft); }
  .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .letter { flex: 0 0 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 14px; background: #fff; }
  .choice.sel .letter { background: var(--accent); color: #fff; border-color: var(--accent); }
  .bar { position: sticky; bottom: 0; background: rgba(246,244,239,.96); border-top: 1px solid var(--line); padding: 12px 16px; margin: 24px -16px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .bar .btn { margin: 0; }
  .score { font-size: 40px; font-weight: 750; margin: 4px 0; }
  .status { font-size: 14px; padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
  .status.ok { background: var(--good-soft); color: var(--good); }
  .status.fail { background: var(--bad-soft); color: var(--bad); }
  .status.wait { background: var(--accent-soft); color: var(--accent); }
  .sol { white-space: pre-line; margin-top: 10px; font-size: 15px; background: #faf9f6; border-left: 3px solid var(--accent); padding: 8px 12px; }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .tag.good { background: var(--good-soft); color: var(--good); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.part { background: #fdf3dc; color: var(--warn); }
  .small { font-size: 13px; color: var(--muted); }
  .hidden { display: none; }
  .q.wm { background-image: var(--wm); background-repeat: repeat; }
  .q.wm .choice:not(.sel):not(.right):not(.wrong) { background: transparent; }
  #shield { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
  .shieldcard { max-width: 460px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; text-align: center; }
  .shieldcard h2 { margin: 8px 0; font-size: 22px; }
  body.shielded .wrap { visibility: hidden; }
  @media print { body { display: none !important; } }
  .fr { margin-top: 12px; }
  .frpart { font-weight: 700; font-size: 14px; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .5px; }
  .frrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
  .frfield { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
  .frlabel { font-size: 17px; }
  .frprefix { font-size: 18px; }
  .fr input.num { width: 92px; } .fr input.let { width: 110px; text-transform: uppercase; letter-spacing: 1px; }
  .fr input, .fr select { padding: 8px 10px; font-size: 17px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); width: auto; }
  .fr input:disabled, .fr select:disabled { background: #f3f1ec; }
  code { background: #eee; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Practice</h1>
    <p id="subtitle">Mr. Cross</p>
  </header>
  <div id="app"></div>
</div>

<script>
/* =====================================================================
   TEACHER SETTINGS — edit this block
   ===================================================================== */
const CONFIG = {
  TEACHER_NAME: 'Mr. Cross',

  // Paste your Apps Script web app URL here (ends in /exec). Leave '' to skip saving.
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbycKSv_XXuM9HI9evVQ6dapHk0hGWBgqPVEh8CneUqkoOKx8CzKUUGa14x3lHrQl-Ih/exec',

  PERIODS: ['1st', '2nd', '4th', '5th', '6th', '7th', '8th'],

  // Change this word every semester so last semester's versions don't repeat.
  SALT: 'fall-2026',

  // Show worked solutions after a student submits?
  SHOW_SOLUTIONS: true,

  // Send each student's work (answers, typed work, drawings) to a Google Doc in your Drive.
  // Needs the updated PracticeResults.gs. Set to false to send scores only.
  SEND_WORK: true,

  // Defaults for the menu assignments (the assignment builder can set these per link):
  // RETRIES  = extra tries on a missed question (0 = no Check button; graded only at Submit).
  //            Each retry is a NEW version of that question, so answers can't be copied.
  // ATTEMPTS = how many times a student may take the whole assignment (each attempt has new numbers).
  RETRIES: 0,
  // LOCKDOWN = questions only show in full screen; right-click/copy/print are blocked; leaving the page
  //            (other tab, other app, Google Lens panel, exiting full screen) hides the questions and is counted.
  LOCKDOWN: true,
  // SAME_FOR_EVERYONE = true gives every student the identical questions (same numbers, same order).
  // Usually set per assignment instead: same: true in SETS, or the builder's "Same questions for everyone" box.
  SAME_FOR_EVERYONE: false,
  // AI_GRADING = true lets "Prove the identity" questions be graded by Claude through your Apps Script
  // (needs an Anthropic API key saved in the script — see PracticeResults.gs). false = step checker only.
  AI_GRADING: true,
  // WATERMARK = faint student name, period, and date repeated across every question, so a shared screenshot shows whose it is.
  WATERMARK: true,
  ATTEMPTS: 1,

  // Teacher answer-key PIN, stored as a hash. Default PIN is 1234.
  // To change it: open practice.html?makehash=YOURPIN and paste the number shown here.
  TEACHER_PIN_HASH: '676594817605674',
};

// Assignments, grouped by subject.
//   One assignment:          practice.html?set=KEY
//   A subject's list only:   practice.html?subject=geometry   (or precalc, act)
// Each item is [question type, how many] or [question type, how many, 'fr'] for free response.
// Optional per assignment: retries: 2 (Check button + new versions), attempts: 3 (whole-assignment tries),
//   same: true (every student gets identical questions).
// Types:
//   5.1: angleSum, extAngleAlgebra, extAngleRatio, classifyTriangle
//   5.2: congStatement (#1-2), correspondingParts (#3-6), findXY (#7-8), congReason (#9-10), thirdAngle (#13-14)
//   5.3–5.6: triCongruence (marked figures), triCongruenceGiven ("Given:" text, unmarked figure)
//   Pre-Calc 2.1: trigIdentityFill (#1–4), trigEvaluate (#5–10), trigSimplify (#11–20, 31–38), trigFactor (#21–30), trigAddSub (#39–44)
//   Pre-Calc 2.2: trigIsIdentity, trigVerifyReason (#5–14), trigVerifyStep (#5–32), trigSinCos (#27–32)
//   Pre-Calc 2.2 proofs: trigProve (students write the proof; AI graded — set up the key in PracticeResults.gs)
//   Pre-Calc 2.3: trigCheckSolution (#7–12), trigSolveBasic (#13–20), trigSolveFactor (#21–30), trigSolveInterval (#31–40), trigSolveMultiple (#41–48),
//                 trigSolveApprox (#51–60), trigSolveInverse (#61–72); in degrees: trigSolveDegInterval, trigSolveDegGeneral, trigSolveDegApprox
//   Pre-Calc 2.4: trigSumDiffExact (#9–28), trigSumDiffFormula (#29–42), trigSumDiffGiven (#43–54)
//   Pre-Calc 2.5: trigMultiAngleSolve (#5–12, 43–46), trigDoubleRewrite (#13–18), trigDoubleValues (#19–22), trigPowerReduce (#25–32),
//                 trigHalfExact (#33–38), trigHalfValues (#39–42), trigProdToSum (#47–50), trigSumToProd (#51–54)
//   Pre-Calc P.1–P.10: p1…–p10… templates (Chapter P Prerequisites)
//   Pre-Calc 1.1–1.8: t1…–t8… templates (Chapter 1 Trigonometry)
//   Pre-Calc 5.1–5.5: e1…–e5… templates (Chapter 5 Exponential and Logarithmic Functions)
//   Pre-Calc 3.1: triSinesAAS (#5–22), triSinesSSA (#23–32), triAmbiguousB (#33–36), triAreaSAS (#37–44), triSinesWord (word problems, #45+)
//   Pre-Calc 3.2: triCosSSS / triCosSAS (#5–24), triParallelogram (#25–30), triWhichLaw (#31–36), triHeron (#37–44), triCosWord (word problems, like #45)
//   Pre-Calc 4.1: cxEqual (#7–8), cxAddSub (#9–16), cxMultiply (#17–24), cxConjugate (#25–32), cxDivide (#33–40), cxSqrtNeg (#41–48), cxQuadratic (#49–58)
//   Pre-Calc 4.2: cxNumSolutions (#5–8), cxDiscriminant (#9–14), cxSolveQuad (#15–24), cxQuartic (#25–28), cxLinearFactors (#33–48), cxGivenZero (#49–58)
//   Pre-Calc 4.3: cpRead (#5–10), cpAbs (#11–16), cpAddSub (#17–28), cpConjugate (#29–34), cpDistance (#35–38)
//   Pre-Calc 4.4: tfToTrig (#5–28), tfToStandard (#29–38), tfMultiply (#43–48), tfDivide (#49–54)
//   Pre-Calc 4.5: dmPower (#5–14), dmPowerStd (#15–24), dmSquareRoots (#29–36), dmNthRoots (#37–52), dmSolveEq (#53–64)
//   Pre-Calc 3.4: vecDot (#5–10), vecDotProps (#11–22), vecMagnitude (#23–28), vecAngle (#29–42), vecTriangle (#43–46), vecDotFromAngle (#47–50)
//   other: dilation, composite, trigGraph
const SUBJECTS = {
  geometry: 'Geometry',
  precalc:  'Pre-Calculus',
  act:      'ACT Prep',
};
const SETS = {
  // ----- Geometry -----
  'geo-transform': { subject: 'geometry', hidden: true, title: 'Ch. 4 Transformations',     items: [['dilation', 5], ['composite', 5]] },
  'geo-5-1':       { subject: 'geometry', title: '5.1 Angles of Triangles',   items: [['classifyTriangle', 3], ['angleSum', 3], ['extAngleAlgebra', 2], ['extAngleRatio', 2]] },
  'geo-5-2':       { subject: 'geometry', title: '5.2 Congruent Polygons',    items: [['congStatement', 3], ['correspondingParts', 3], ['findXY', 2], ['congReason', 2], ['thirdAngle', 2]] },
  'geo-5-3-6':     { subject: 'geometry', title: '5.3–5.6 Triangle Congruence (SSS, SAS, ASA, AAS, HL)', items: [['triCongruence', 9], ['triCongruenceGiven', 3]] },
  // ----- Pre-Calculus -----
  'precalc-p-1':   { subject: 'precalc',  title: 'P.1 Review of Real Numbers', items: [['p1Classify', 2], ['p1Order', 2], ['p1Interval', 4], ['p1AbsVal', 3], ['p1Compare', 2], ['p1Distance', 2]] },
  'precalc-p-2':   { subject: 'precalc',  title: 'P.2 Solving Equations', items: [['p2Linear', 3], ['p2Rational', 3], ['p2Factor', 2], ['p2SqRoots', 2], ['p2CompleteSq', 2], ['p2Quadratic', 3]] },
  'precalc-p-3':   { subject: 'precalc',  title: 'P.3 The Cartesian Plane and Graphs of Equations', items: [['p3Distance', 2], ['p3DistMid', 2], ['p3Triangle', 1], ['p3OnGraph', 2], ['p3Table', 1], ['p3Intercepts', 2], ['p3Symmetry', 2], ['p3CircleEq', 2], ['p3CircleRead', 1]] },
  'precalc-p-4':   { subject: 'precalc',  title: 'P.4 Linear Equations in Two Variables', items: [['p4SlopeGraph', 1], ['p4SlopeInt', 2], ['p4Slope2Pts', 2], ['p4ThreePoints', 1], ['p4PointSlope', 2], ['p4TwoPoints', 2], ['p4ParPerpTest', 2], ['p4ParPerpLines', 2], ['p4InterceptForm', 1]] },
  'precalc-p-5':   { subject: 'precalc',  title: 'P.5 Functions', items: [['p5IsFunction', 3], ['p5Evaluate', 3], ['p5Table', 1], ['p5Zeros', 2], ['p5FeqG', 2], ['p5Domain', 3], ['p5DiffQuot', 3]] },
  'precalc-p-6':   { subject: 'precalc',  title: 'P.6 Analyzing Graphs of Functions', items: [['p6GraphValues', 2], ['p6VLT', 2], ['p6Zeros', 3], ['p6IncDec', 3], ['p6GeqZero', 2], ['p6AvgRate', 2]] },
  'precalc-p-7':   { subject: 'precalc',  title: 'P.7 A Library of Parent Functions', items: [['p7Name', 3], ['p7LinearFn', 3], ['p7Step', 4]] },
  'precalc-p-8':   { subject: 'precalc',  title: 'P.8 Transformations of Functions', items: [['p8FromGraph', 4], ['p8Describe', 5], ['p8FromDesc', 4]] },
  'precalc-p-9':   { subject: 'precalc',  title: 'P.9 Combinations of Functions: Composite Functions', items: [['p9Arith', 3], ['p9Evaluate', 4], ['p9Compose', 3], ['p9CompDomain', 3]] },
  'precalc-p-10':  { subject: 'precalc',  title: 'P.10 Inverse Functions', items: [['p10FindInverse', 3], ['p10Verify', 2], ['p10Table', 2], ['p10HasInverse', 2], ['p10Determine', 3], ['p10CompInverse', 2]] },
  'precalc-trig':  { subject: 'precalc', hidden: true,  title: 'Graphs of Sine and Cosine', items: [['trigGraph', 6]] },
  'precalc-1-1':   { subject: 'precalc',  title: '1.1 Radian and Degree Measure', items: [['t1Quadrant', 2], ['t1Coterminal', 2], ['t1CompSupp', 2], ['t1DegToRad', 2], ['t1RadToDeg', 2], ['t1DMS', 1], ['t1Arc', 1], ['t1CentralAngle', 1], ['t1Sector', 1], ['t1Speed', 1]] },
  'precalc-1-2':   { subject: 'precalc',  title: '1.2 Trigonometric Functions: The Unit Circle', items: [['t2SixFromPoint', 2], ['t2Point', 2], ['t2SinCosTan', 3], ['t2SixExact', 2], ['t2Period', 2], ['t2GivenValue', 2], ['t2Calc', 2]] },
  'precalc-1-3':   { subject: 'precalc',  title: '1.3 Right Triangle Trigonometry', items: [['t3SixTriangle', 2], ['t3OtherFive', 2], ['t3SpecialTable', 2], ['t3Calc', 2], ['t3Identities', 2], ['t3SpecialAngle', 2], ['t3SolveSides', 2]] },
  'precalc-1-4':   { subject: 'precalc',  title: '1.4 Trigonometric Functions of Any Angle', items: [['t4SixPoint', 2], ['t4Quadrant', 1], ['t4Remaining', 2], ['t4Identity', 1], ['t4Line', 1], ['t4Quadrantal', 2], ['t4RefAngle', 2], ['t4UseRef', 2], ['t4Calc', 1], ['t4SolveTheta', 2]] },
  'precalc-1-5':   { subject: 'precalc',  title: '1.5 Graphs of Sine and Cosine Functions', items: [['t5AmpPeriod', 3], ['t5Relationship', 2], ['t5Features', 3], ['t5FindAD', 2], ['t5FindABC', 2], ['t5WriteEq', 2]] },
  'precalc-1-6':   { subject: 'precalc',  title: '1.6 Graphs of Other Trigonometric Functions', items: [['t6Period', 3], ['t6Asym', 3], ['t6Match', 3], ['t6Solve', 3]] },
  'precalc-1-7':   { subject: 'precalc',  title: '1.7 Inverse Trigonometric Functions', items: [['t7Exact', 3], ['t7Calc', 2], ['t7ThetaFn', 2], ['t7InverseProps', 2], ['t7Composite', 3], ['t7Algebraic', 2]] },
  'precalc-1-8':   { subject: 'precalc',  title: '1.8 Applications and Models', items: [['t8SolveRight', 4], ['t8Altitude', 2], ['t8Word', 6]] },
  'precalc-2-1':   { subject: 'precalc',  title: '2.1 Using Fundamental Identities', items: [['trigIdentityFill', 3], ['trigEvaluate', 3], ['trigSimplify', 4], ['trigFactor', 2], ['trigAddSub', 2]] },
  'precalc-2-2':   { subject: 'precalc',  title: '2.2 Verifying Trigonometric Identities', items: [['trigIsIdentity', 2], ['trigVerifyReason', 3], ['trigVerifyStep', 4], ['trigSinCos', 3]] },
  'precalc-2-2-prove': { subject: 'precalc', title: '2.2 Proving Identities (AI graded)', items: [['trigWhichProof', 2], ['trigProve', 4]] },
  'precalc-2-3':   { subject: 'precalc',  title: '2.3 Solving Trigonometric Equations', items: [['trigCheckSolution', 2], ['trigSolveBasic', 3], ['trigSolveFactor', 3], ['trigSolveInterval', 3], ['trigSolveMultiple', 3]] },

/* ---------- seeded randomness ---------- */
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

/* ---------- formatting ---------- */
const MINUS = '−';
function fmt(n) {
  if (Math.abs(n - Math.round(n)) < 1e-9) n = Math.round(n);

}

const deg = (n) => fmt(n) + '°';

}
const halfInt = (n) => Math.abs(n * 2 - Math.round(n * 2)) < 1e-9;

// Build 4 distinct choices: correct + priority distractors + shuffled candidates + fallbacks
function buildChoices(r, correct, cands, fallback, priority = []) {
  const out = [correct];
  const add = (c) => { if (c != null && !out.includes(c) && out.length < 4) out.push(c); };
  priority.forEach(add);
  shuffle(r, cands).forEach(add);
  for (let i = 0; out.length < 4 && i < 200; i++) add(fallback(i));
  const choices = shuffle(r, out);
  return { choices, answer: choices.indexOf(correct) };
}

// Value of a student's answer: plain text ("1/2", "-3", "95°", "x = 5") or LaTeX from the math editor (\frac{1}{2}, 2\pi, \sqrt{3})
function parseNum(v) {

  t = t.trim().replace(/^.*=/, '').replace(/\^\(?@\)?/g, '').replace(/degrees?$/i, '').replace(/[°\s,]/g, '')
    .replace(/−/g, '-').replace(/π/g, 'pi').replace(/√/g, 'sqrt').replace(/xx|×|·|\\cdot/g, '*').replace(/-:|÷/g, '/');

// tiny safe evaluator: numbers, + - * / ^, parentheses, pi, sqrt(), implied multiplication (2pi, 3sqrt(2))
function evalExpr(src) {
  let i = 0;
  const peek = () => src[i];
  const startsAtom = () => i < src.length && (/[\d.(]/.test(src[i]) || src.startsWith('pi', i) || src.startsWith('sqrt', i));
  function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const op = src[i++]; const w = term(); v = op === '+' ? v + w : v - w; } return v; }
  function term() {
    let v = unary();
    for (;;) {

      else if (startsAtom()) v *= power();

  function unary() { if (peek() === '-') { i++; return -unary(); } if (peek() === '+') { i++; return unary(); } return power(); }
  function power() { const b = atom(); if (peek() === '^') { i++; return Math.pow(b, unary()); } return b; }
  function atom() {
    if (peek() === '(') { i++; const v = expr(); if (src[i++] !== ')') throw 0; return v; }
    if (src.startsWith('pi', i)) { i += 2; return Math.PI; }
    if (src.startsWith('sqrt', i)) { i += 4; return Math.sqrt(atom()); }
    const m = /^\d*\.?\d+/.exec(src.slice(i));
    if (!m) throw 0;
    i += m[0].length; return +m[0];

      draw: (cv) => drawExtTriangle(cv, { left: B, top: A, names: ['A', 'B', 'C', 'D'], labels: { top: `(${t1})°`, left: `(${t2})°`, ext: `(${t3})°` } }),

TEMPLATES.extAngleRatio = (r) => {

TEMPLATES.classifyTriangle = (r) => {

    const kind = pick(r, ['right', 'acuteTrap', 'obtuseTrap', 'iso', 'scalene']);
    let s;
    if (kind === 'right') s = pick(r, triples).slice();
    else if (kind === 'acuteTrap') { const tr = pick(r, triples); s = [tr[0], tr[1], tr[2] - 1]; }
    else if (kind === 'obtuseTrap') { const tr = pick(r, triples); s = [tr[0], tr[1], tr[2] + 1]; }
    else if (kind === 'iso') { const a = ri(r, 4, 15); s = [a, a, ri(r, 2, 2 * a - 1)]; }
    else s = [ri(r, 4, 20), ri(r, 4, 20), ri(r, 4, 20)];
    const so = s.slice().sort((a, b) => a - b);
    if (so[0] + so[1] <= so[2]) continue;
    const [a, b, c] = so;
    const sumSq = a * a + b * b, cSq = c * c;
    const ang = sumSq === cSq ? 'right' : sumSq > cSq ? 'acute' : 'obtuse';
    const eq = new Set(so).size;
    const side = eq === 1 ? 'equilateral' : eq === 2 ? 'isosceles' : 'scalene';
    const lab = (an, sd) => `${an[0].toUpperCase() + an.slice(1)} and ${sd}`;
    const cands = [];
    ['acute', 'right', 'obtuse'].filter((x) => x !== ang).forEach((o) => cands.push(lab(o, side)));
    ['scalene', 'isosceles', 'equilateral'].filter((x) => x !== side && (x !== 'equilateral' || ang === 'acute')).forEach((o) => cands.push(lab(ang, o)));
    const priority = ang !== 'right' && kind.endsWith('Trap') ? [lab('right', side)] : [];
    const shown = shuffle(r, s);
    const rel = sumSq === cSq ? '=' : sumSq > cSq ? '>' : '<';
    return {
      topic: 'Classifying triangles',
      stem: `A triangle has side lengths of ${shown[0]} inches, ${shown[1]} inches, and ${shown[2]} inches. Which of the following best describes the triangle?`,
      ...buildChoices(r, lab(ang, side), cands, (i) => lab(['acute', 'right', 'obtuse'][i % 3], ['scalene', 'isosceles'][(i >> 1) % 2]), priority),
      frStem: `A triangle has side lengths of ${shown[0]} inches, ${shown[1]} inches, and ${shown[2]} inches. Classify the triangle by its angles and by its sides.`,
      fr: { fields: [{ kind: 'select', label: 'By angles', options: ['acute', 'right', 'obtuse'] }, { kind: 'select', label: 'By sides', options: ['scalene', 'isosceles', 'equilateral'] }],
        check: (v) => v[0] === ang && v[1] === side, display: lab(ang, side), key: [ang, side] },
      solution: `The longest side is ${c}. Compare: ${a}² + ${b}² = ${sumSq} and ${c}² = ${cSq}. Since ${sumSq} ${rel} ${cSq}, the triangle is ${ang}. ${side === 'scalene' ? 'All three sides are different, so it is scalene.' : side === 'isosceles' ? 'Two sides are equal, so it is isosceles.' : 'All three sides are equal, so it is equilateral.'}`,
    };
  }
};

TEMPLATES.dilation = (r) => {

    const P = [C[0] + v[0], C[1] + v[1]];
    const img = [C[0] + k * v[0], C[1] + k * v[1]];
    if (Math.abs(img[0]) > 15 || Math.abs(img[1]) > 15) continue;

};

// 4.1 #7–8: equal complex numbers
TEMPLATES.cxEqual = (r) => {
  const a = nz(r, -9, 9), b = nz(r, -9, 9), kind = ri(r, 0, 2), sg = (c) => (c < 0 ? ` ${MINUS} ${-c}` : ` + ${c}`);
  let eq, why;
  if (kind === 0) { const p = nz(r, -8, 8), q = nz(r, -8, 8); eq = `(a${sg(p)}) + (b${sg(q)})i = ${cxIn(a + p, b + q)}`; why = `Real parts: a${sg(p)} = ${fmt(a + p)}, so a = ${fmt(a)}.\nImaginary parts: b${sg(q)} = ${fmt(b + q)}, so b = ${fmt(b)}.`; }
  else if (kind === 1) { const k = pick(r, [2, 3, 4]), j = pick(r, [2, 3]), q = nz(r, -6, 6); eq = `${k}a + (${j}b${sg(q)})i = ${cxIn(k * a, j * b + q)}`; why = `Real parts: ${k}a = ${fmt(k * a)}, so a = ${fmt(a)}.\nImaginary parts: ${j}b${sg(q)} = ${fmt(j * b + q)}, so b = ${fmt(b)}.`; }
  else { const k = pick(r, [2, 3]), p = a - b, q = k * a - b; eq = `a + bi = ${p ? `(b${sg(p)})` : 'b'} + (${k}a${q ? sg(-q) : ''})i`; why = `Real parts: a = b${p ? sg(p) : ''}. Imaginary parts: b = ${k}a${q ? sg(-q) : ''}.\nSubstitute: a = ${k}a${q ? sg(-q) : ''}${p ? sg(p) : ''}, so a = ${fmt(a)} and b = ${fmt(b)}.`; }
  const T = (x, y) => `a = ${fmt(x)}, b = ${fmt(y)}`, correct = T(a, b);
  return {
    topic: 'Equal complex numbers', stem: `Find real numbers a and b such that the equation is true.   ${eq}`,
    ...buildChoices(r, correct, [T(b, a), T(-a, b), T(a, -b), T(-a, -b)].filter((c) => c !== correct), (i) => T(a + i + 1, b)),
    fr: FR.nums(['a =', 'b ='], [a, b], correct), solution: why,

// 4.1 #9–16: add or subtract
TEMPLATES.cxAddSub = (r) => {

      let re = zs[0][0], im = zs[0][1], bad = [zs[0][0], zs[0][1]];
      ops.forEach((o, k) => { re += o * zs[k + 1][0]; im += o * zs[k + 1][1]; bad[0] += o * zs[k + 1][0]; bad[1] += zs[k + 1][1]; });
      const z = cx(Sd(re), Sd(im));

        topic: 'Adding and subtracting', stem: `Perform the operation and write the result in standard form.   ${expr}`,
        ...cxMC(r, z, [cx(Sd(bad[0]), Sd(bad[1])), cx(Sd(re), Sd(-im)), cx(Sd(-re), Sd(im)), cx(Sd(re + 2 * (zs[1][0] * ops[0] < 0 ? zs[1][0] : 0)), Sd(im))]),
        fr: cxFR('=', z),
        solution: `Combine the real parts and the imaginary parts separately${ops.includes(-1) ? ' (subtracting changes the sign of both parts)' : ''}.\nReal: ${fmt(re)}.  Imaginary: ${fmt(im)}.\nResult: ${cxText(z)}`,
      };
    }

    const m = pick(r, [2, 3, 5, 6, 7]), k1 = ri(r, 1, 5), k2 = ri(r, 1, 5), p = ri(r, -10, 15), q = ri(r, -10, 15);
    const s1 = r() < 0.5 ? 1 : -1, s2 = r() < 0.5 ? 1 : -1, op = r() < 0.5 ? 1 : -1, A = k1 * k1 * m, B = k2 * k2 * m;

      solution: `Write each square root of a negative number in i-form first: ${sqrtNeg(A)} = ${k1 === 1 ? '' : k1}√${m} i${asI ? '' : `, ${sqrtNeg(B)} = ${k2 === 1 ? '' : k2}√${m} i`}.\nReal parts: ${fmt(p)} ${op > 0 ? '+' : MINUS} ${q < 0 ? `(${fmt(q)})` : fmt(q)} = ${fmt(re)}.  Imaginary parts: ${fmt(imK)}√${m} i.\nResult: ${cxText(z)}`,

// 4.1 #17–24: multiply

    return { topic: 'Multiplying', stem: `Perform the operation and write the result in standard form.   ${expr}`,
      ...cxMC(r, z, [cxR(first ? m - k * k : k * k - m), cxR(m * m + k * k), cx(Sd(val), Sd(2 * k, 1, m))]), fr: cxFR('=', z),
      solution: `This is (a + b)(a − b) = a² − b² with an i: ${first ? `(√${m})² − (${k === 1 ? '' : k}i)² = ${m} − (${k * k})(−1)` : `${k}² − (√${m} i)² = ${k * k} − (${m})(−1)`} = ${val}` };

  else { z1 = C2(nz(r, -9, 9), nz(r, -9, 9)); z2 = C2(nz(r, -9, 9), nz(r, -9, 9)); expr = `${cxInP(z1.re[0], z1.im[0])}${cxInP(z2.re[0], z2.im[0])}`; }

  };

// 4.1 #33–40: quotients

    else if (kind === 'byI') { N = C2(nz(r, -12, 16), nz(r, -12, 16)); D = C2(0, pick(r, [1, 1, 2, 3, -1])); }
    else { N = C2(0, nz(r, -6, 6)); Dsq = C2(nz(r, -5, 5), nz(r, -5, 5)); D = cMul(Dsq, Dsq); }

    const w = [C2(NC.re, NC.im), C2(Qr(NC.re[0], den), Qr(-NC.im[0], den)), cMul(N, D), wrongDen ? C2(Qr(NC.re[0], wrongDen), Qr(NC.im[0], wrongDen)) : C2(Qr(NC.im[0], den), Qr(NC.re[0], den))].map((x) => ({ re: Qr(...x.re), im: Qr(...x.im) }));

    };

// 4.1 #41–48: square roots of negative numbers — write them with i first

      why = `${sqrtNeg(a)} · ${sqrtNeg(b)} = (√${a} i)(√${b} i) = √${a * b} · i² = ${MINUS}${sAbsText(Sd(1, 1, a * b))}\n(Careful: √(${MINUS}${a}) · √(${MINUS}${b}) is not √${a * b}. Write each one with i first.)`;

      wrongs = [cx(Sd(k1 + op * k2, 1, m), Sd(0)), cx(Sd(0), Sd(1, 1, A + op * B > 0 ? A + op * B : -(A + op * B))), cx(Sd(0), Sd(-(k1 + op * k2), 1, m))];

// quadratic with integer coefficients: solutions as exact strings and values

    const wrongT = [ang[p], ang[q], ang[k3], 180 - tgt].filter((v) => v !== tgt);
    const cands = wrongT.map((tt) => { const xv = (tt - c1) / m1; return pair(xv, ySolve(xv)); });
    cands.push(pair(y, x), pair(x, ySignSlip));
    const { A, B, L1, nb } = congruentPair(r, triShape(ang));
    const alA = [null, null, null], alB = [null, null, null], slA = [null, null, null], slB = [null, null, null];
    alA[p] = ang[p] + '°'; alA[q] = ang[q] + '°'; slA[s] = String(L);
    alB[tv] = `(${term(m1, c1)})°`; slB[s] = `(${sideExpr})`;
    const st = `△${L1.join('')} ≅ △${nb.join('')}`;
    const angStep = tv === p
      ? `∠${nb[tv]} corresponds to ∠${L1[tv]}, so ${term(m1, c1)} = ${tgt} and x = ${x}.`
      : `The third angle of △${L1.join('')} is 180° ${MINUS} ${ang[p]}° ${MINUS} ${ang[q]}° = ${tgt}°. ∠${nb[tv]} corresponds to ∠${L1[tv]}, so ${term(m1, c1)} = ${tgt} and x = ${x}.`;
    return { topic: 'Congruent polygons: find x and y', size: [620, 290], pair: true,
      stem: `In the figure, ${st}. What are the values of x and y?`,
      draw: (cv) => drawFigure(cv, { note: true, polys: [{ pts: A, names: L1, alab: alA, slab: slA }, { pts: B, names: nb, alab: alB, slab: slB }] }),
      ...buildChoices(r, `x = ${x}, y = ${y}`, cands, (i) => pair(x + [0, 1, -1, 2, 0, -2][i % 6], y + [1, 0, 1, -1, -1, 0][i % 6] + Math.floor(i / 6))),
      fr: FR.nums(['x', 'y'], [x, y], `x = ${x}, y = ${y}`),
      solution: `${angStep} ${SEG(sideName(nb, s))} corresponds to ${SEG(sideName(L1, s))}, so ${sideExpr} = ${L}. Substitute x = ${x}: y = ${y}.` };
  }
};

/* ---------- triangle congruence (5.3 SAS, 5.5 SSS/HL, 5.6 ASA/AAS) ---------- */
// Parts of a triangle: side k joins vertices k and k+1; angle v is at vertex v.
// known = { S: Set of side indices, A: Set of vertex indices, right: vertex index or null }
function congCriteria(known) {
  const S = known.S, A = known.A, out = new Set();
  const sideBetween = (u, v) => [0, 1, 2].find((s) => new Set([s, (s + 1) % 3]).has(u) && new Set([s, (s + 1) % 3]).has(v));
  if (S.size === 3) out.add('SSS');
  for (const v of A) if (S.has((v + 2) % 3) && S.has(v)) out.add('SAS');
  const angs = [...A];
  for (let i = 0; i < angs.length; i++) for (let j = i + 1; j < angs.length; j++) {
    const between = sideBetween(angs[i], angs[j]);
    for (const s of S) out.add(s === between ? 'ASA' : 'AAS');
  }
  if (known.right != null && A.has(known.right)) {
    const r = known.right, hyp = (r + 1) % 3;
    if (S.has(hyp) && (S.has(r) || S.has((r + 2) % 3))) out.add('HL');
  }
  return out;
}

function triCong(r, givenText) {
  const CRIT = ['SSS', 'SAS', 'ASA', 'AAS', 'HL'];
  const target = pick(r, ['SSS', 'SSS', 'SAS', 'SAS', 'ASA', 'ASA', 'AAS', 'AAS', 'HL', 'none']);
  for (let t = 0; t < 20000; t++) {
    const config = pick(r, ['separate', 'separate', 'line', 'point', 'vertical']);
    // shape
    let ang, right = null;
    if (target === 'HL' || r() < 0.2) {
      const a = ri(r, 28, 62); if (a === 45) continue;
      right = ri(r, 0, 2); ang = [0, 0, 0]; ang[right] = 90; ang[(right + 1) % 3] = a; ang[(right + 2) % 3] = 90 - a;
    } else ang = triAngles(r, 35, 100);
    // implicit part from the figure
    const implicit = { S: new Set(), A: new Set() };
    let k = null, v0 = null;
    if (config === 'line' || config === 'point') { k = ri(r, 0, 2); implicit.S.add(k); }
    if (config === 'vertical') { v0 = ri(r, 0, 2); if (v0 === right) continue; implicit.A.add(v0); }
    // marked parts
    const avail = [];
    [0, 1, 2].forEach((s) => { if (!implicit.S.has(s)) avail.push(['S', s]); });
    [0, 1, 2].forEach((v) => { if (!implicit.A.has(v) && v !== right) avail.push(['A', v]); });
    const nMark = ri(r, 1, 3);
    const marked = shuffle(r, avail).slice(0, nMark);
    const known = { S: new Set(implicit.S), A: new Set(implicit.A), right };
    marked.forEach(([ty, i]) => known[ty].add(i));
    if (right != null) known.A.add(right);
    const crit = congCriteria(known);
    const nKnown = known.S.size + known.A.size;
    if (target === 'none') { if (crit.size || nKnown < 3) continue; }
    else if (crit.size !== 1 || !crit.has(target)) continue;
    // in "Given" mode the implicit part must not be the only thing (keep it a real question)
    // ----- build figure
    const P = triShape(ang);
    const L1 = pickLetters(r, 3);
    let T2pts, N2, group = null, polysOf;
    if (config === 'separate') {
      const pr = congruentPair(r, P); polysOf = { A: pr.A, B: pr.B }; T2pts = pr.B; N2 = pr.nb; L1.splice(0, 3, ...pr.L1);
    } else {
      const extra = pickLetters(r, 2, L1);
      if (config === 'line') {
        const a = P[k], b = P[(k + 1) % 3], c = P[(k + 2) % 3], d = VEC.norm(VEC.sub(b, a));
        const proj = VEC.add(a, VEC.mul(d, (c[0] - a[0]) * d[0] + (c[1] - a[1]) * d[1]));
        const Q = VEC.sub(VEC.mul(proj, 2), c);
        T2pts = [0, 1, 2].map((i) => (i === (k + 2) % 3 ? Q : P[i]));
        N2 = [0, 1, 2].map((i) => (i === (k + 2) % 3 ? extra[0] : L1[i]));
      } else if (config === 'point') {
        const M = VEC.mul(VEC.add(P[k], P[(k + 1) % 3]), 0.5);
        T2pts = P.map((p) => VEC.sub(VEC.mul(M, 2), p));
        N2 = [0, 1, 2].map((i) => (i === k ? L1[(k + 1) % 3] : i === (k + 1) % 3 ? L1[k] : extra[0]));
      } else {
        const C = P[v0];
        T2pts = P.map((p) => VEC.sub(VEC.mul(C, 2), p));
        let e = 0; N2 = [0, 1, 2].map((i) => (i === v0 ? L1[v0] : extra[e++]));
      }
      const all = transformPts([...P, ...T2pts], r, { reflect: r() < 0.5 });
      polysOf = { A: all.slice(0, 3), B: all.slice(3) };
      group = 'g';
    }
    // marks
    const ticks = [0, 0, 0], arcs = [0, 0, 0], rt = [false, false, false];
    let tc = 1, ac = 1;
    shuffle(r, marked).forEach(([ty, i]) => { if (ty === 'S') ticks[i] = tc++; else arcs[i] = ac++; });
    if (right != null) rt[right] = true;
    const showMarks = !givenText;
    const poly = (pts, names) => ({ pts, names, group, ticks: showMarks ? ticks : null, arcs: showMarks ? arcs : null, right: showMarks ? rt : null });
    const draw = (cv) => drawFigure(cv, { polys: [poly(polysOf.A, L1), poly(polysOf.B, N2)] });
    // names & statements
    const angName = (N, v) => `∠${N[(v + 2) % 3]}${N[v]}${N[(v + 1) % 3]}`;
    const sideStr = (N, s) => SEG(N[s] + N[(s + 1) % 3]);
    const order = shuffle(r, [0, 1, 2]);
    const lhs = `△${order.map((i) => L1[i]).join('')}`;
    const rhsOf = (perm) => `△${perm.map((i) => N2[order[i]]).join('')}`;
    const rhs = rhsOf([0, 1, 2]);
    const wrongPerms = [[0, 2, 1], [1, 0, 2], [2, 1, 0], [1, 2, 0], [2, 0, 1]].map(rhsOf).filter((x) => x !== rhs);
    // explanation pieces
    const facts = [];
    marked.forEach(([ty, i]) => facts.push(ty === 'S' ? `${sideStr(L1, i)} ≅ ${sideStr(N2, i)}` : `${angName(L1, i)} ≅ ${angName(N2, i)}`));
    if (right != null) facts.push(`${angName(L1, right)} and ${angName(N2, right)} are right angles`);
    const implicitFacts = [];
    if (k != null) implicitFacts.push(`${sideStr(L1, k)} ≅ ${sideStr(N2, k)} (shared side, Reflexive Property)`);
    if (v0 != null) implicitFacts.push(`${angName(L1, v0)} ≅ ${angName(N2, v0)} (vertical angles)`);
    const givenLine = givenText ? `Given: ${facts.join('; ')}.` : '';
    const name = target === 'none' ? null : target;
    let whyNot = '';
    if (target === 'none') {
      const ns = known.S.size, na = known.A.size;
      whyNot = na === 3 && ns === 0 ? 'Three pairs of congruent angles (AAA) only show the triangles have the same shape, not the same size.'
        : ns === 2 && na === 1 ? 'The congruent angle is not between the two congruent sides (SSA), and SSA does not prove triangles congruent.'
        : 'There is not enough information to use SSS, SAS, ASA, AAS, or HL.';
    }
    const sol = `${facts.length ? (givenText ? 'Given' : 'Marked') + ': ' + facts.join('; ') + '. ' : ''}${implicitFacts.length ? 'From the figure: ' + implicitFacts.join('; ') + '. ' : ''}` +
      (name ? `That is ${{ SSS: 'three pairs of sides', SAS: 'two sides and the included angle', ASA: 'two angles and the included side', AAS: 'two angles and a non-included side', HL: 'a hypotenuse and a leg of right triangles' }[name]}, so ${lhs} ≅ ${rhs} by ${name}.` : whyNot + ' Not possible.');
    const base = givenText ? `${givenLine} Use the figure. ` : 'Use the markings in the figure. ';
    // Wrong reasons that are clearly wrong (never ASA vs AAS, which a student could justify with the Third Angles Theorem,
    // and never SAS/SSS for HL, which the Pythagorean Theorem could justify)
    const tempting = { SSS: 'SAS', SAS: pick(r, ['SSS', 'ASA']), ASA: 'SAS', AAS: 'SAS', HL: pick(r, ['ASA', 'AAS']) };
    const debatable = { ASA: ['AAS'], AAS: ['ASA'], HL: ['SAS', 'SSS'] };
    const correct = name || 'Not possible';
    const pool = [...CRIT, 'Not possible'].filter((x) => x !== correct && !(debatable[correct] || []).includes(x));
    const mc = buildChoices(r, correct, pool, () => null, name ? [tempting[name], 'Not possible'] : [pick(r, ['SAS', 'AAS'])]);
    // Part B: any correct correspondence is accepted, written either way around
    const fwd = {}, back = {};
    L1.forEach((c, i) => { fwd[c] = N2[i]; back[N2[i]] = c; });
    const sameSet = (str, arr) => str.split('').sort().join('') === arr.slice().sort().join('');
    const statementOk = (s1, s2) => {
      const a = normLetters(s1), b = normLetters(s2);
      if (a.length !== 3 || b.length !== 3 || new Set(a).size !== 3) return false;
      if (sameSet(a, L1)) return b === a.split('').map((c) => fwd[c]).join('');
      if (sameSet(a, N2)) return b === a.split('').map((c) => back[c]).join('');
      return false;
    };
    const lhsLetters = order.map((i) => L1[i]).join(''), rhsLetters = order.map((i) => N2[i]).join('');
    const lockB = (v) => v[0] === 'Not possible';
    const partSpec = (choiceKind) => ({
      fields: [
        { kind: choiceKind, part: 'Part A', label: choiceKind === 'select' ? 'Reason' : '', options: choiceKind === 'select' ? [...CRIT, 'Not possible'] : mc.choices },
        { kind: 'text', part: 'Part B', label: '', prefix: '△', lockWhen: lockB },
        { kind: 'text', label: '', prefix: '≅ △', lockWhen: lockB },
      ],
      score: (v) => {
        if (!v || !v[0]) return 0;
        if (!name) return v[0] === 'Not possible' ? 1 : 0;
        return (v[0] === name ? 0.5 : 0) + (v[0] !== 'Not possible' && statementOk(v[1], v[2]) ? 0.5 : 0);
      },
      check(v) { return this.score(v) === 1; },
      answered: (v) => !!v[0] && (v[0] === 'Not possible' || (normLetters(v[1]).length > 0 && normLetters(v[2]).length > 0)),
      display: name ? `${lhs} ≅ ${rhs} by ${name}` : 'Not possible',
      key: name ? [name, lhsLetters, rhsLetters] : ['Not possible', '', ''],
    });
    const stem = `${base}Part A: Which postulate or theorem proves the triangles congruent? If they cannot be proven congruent, choose “Not possible.” Part B: If they are congruent, write a congruence statement.`;
    return { topic: 'Triangle congruence', size: config === 'separate' ? [600, 280] : [520, 300], pair: config === 'separate', draw,
      stem, twoPart: { mc: partSpec('choice'), fr: partSpec('select') }, ...mc, solution: sol,
      _check: { known, target, statementOk, L1, N2 } };
  }
}

/* ---------- custom assignments from a link: ?mix=findXY.3_thirdAngle.2&title=...&subject=geometry ---------- */
let CUSTOM_KEY = null;
(function loadCustom() {
  const mix = new URLSearchParams(location.search).get('mix');
  if (!mix) return;
  const items = mix.split('_').map((p) => p.split('.')).filter(([id, n]) => TEMPLATES[id] && +n > 0).map(([id, n, f]) => [id, Math.min(20, Math.floor(+n)), f === 'fr' ? 'fr' : 'mc']);
  if (!items.length) return;
  const q = new URLSearchParams(location.search);
  const title = (q.get('title') || 'Custom Practice').slice(0, 80);
  const subject = SUBJECTS[q.get('subject')] ? q.get('subject') : (QUESTION_TYPES.find((t) => t.id === items[0][0]) || {}).subject || 'geometry';
  const shuffleQs = q.get('order') === 'mixed';
  const retries = Math.max(0, Math.min(5, Math.floor(+q.get('retries') || 0)));
  const attempts = Math.max(1, Math.min(10, Math.floor(+q.get('attempts') || 1)));
  const same = q.get('same') === '1';
  CUSTOM_KEY = 'custom-' + cyrb53(`${mix}|${title}|${shuffleQs}` + (same ? '|same' : '')).toString(36).slice(-8);
  const lockdown = q.get('lock') !== '0';
  SETS[CUSTOM_KEY] = { subject, title, items, shuffle: shuffleQs, mix, custom: true, retries, attempts, lockdown, same };
})();

/* ---------- question generation ---------- */
function applyMode(q, mode) {
  if (q.twoPart) { q.mode = 'fr'; q.fr = mode === 'fr' ? q.twoPart.fr : q.twoPart.mc; return q; } // Part A + Part B
  if (q.proofQ) { q.mode = 'fr'; return q; } // proofs are always written out
  if (mode === 'fr' && q.fr) { q.mode = 'fr'; if (q.frStem) q.stem = q.frStem; if (q._frSolution) q.solution = q._frSolution; }
  else q.mode = 'mc';
  return q;
}
const isAnswered = (q, a) => (q.mode === 'fr'
  ? Array.isArray(a) && (q.fr.answered ? q.fr.answered(a) : q.fr.fields.every((_, k) => String(a[k] || '').trim() !== ''))
  : a !== null && a !== undefined && !Array.isArray(a));
const scoreOf = (q, a) => (q.mode === 'fr'
  ? (q.fr.score ? q.fr.score(Array.isArray(a) ? a : []) : Array.isArray(a) && q.fr.check(a) ? 1 : 0)
  : a === q.answer ? 1 : 0);
const isCorrect = (q, a) => scoreOf(q, a) === 1;
const norm = (s) => s.toLowerCase().replace(/[^a-z]/g, '');
function generate(setKey, period, name, attempt = 1) {
  // same: true → one version for the whole class (retries and new attempts are also the same for everyone)
  const who = setting(setKey, 'same') ? 'everyone' : `${period}|${norm(name)}`;
  const seedStr = `${CONFIG.SALT}|${setKey}|${who}` + (attempt > 1 ? `|a${attempt}` : '');
  const r = mulberry32(cyrb53(seedStr));
  let qs = [];
  for (const [tpl, count, mode] of SETS[setKey].items) for (let i = 0; i < count; i++) {
    const q = applyMode(TEMPLATES[tpl](r), mode); q.tpl = tpl; q.fmt = mode; qs.push(q);
  }
  if (SETS[setKey].shuffle) qs = shuffle(r, qs);
  return { qs, seedStr, version: cyrb53(seedStr).toString(36).slice(-6).toUpperCase() };
}
// a fresh version of question i for retry number t (same type and format, new numbers)
function regenQuestion(seedStr, old, i, t) {
  const q = applyMode(TEMPLATES[old.tpl](mulberry32(cyrb53(`${seedStr}|q${i}|r${t}`))), old.fmt);
  q.tpl = old.tpl; q.fmt = old.fmt;
  return q;
}
const setting = (setKey, name) => {
  const v = SETS[setKey][name];
  if (v !== undefined) return v;
  if (name === 'attempts') return CONFIG.ALLOW_RETAKE ? 99 : CONFIG.ATTEMPTS || 1;
  if (name === 'lockdown') return CONFIG.LOCKDOWN !== false;
  if (name === 'same') return !!CONFIG.SAME_FOR_EVERYONE;
  return CONFIG.RETRIES || 0;
};

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const app = document.getElementById('app');

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  kids.flat().forEach((k) => e.append(k instanceof Node ? k : document.createTextNode(k)));
  return e;
}
const contentWidth = () => Math.min(700, app.clientWidth) - 38;

function startScreen(teacher = false) {

    if (SUBJECTS[subj]) document.getElementById('title').textContent = SUBJECTS[subj];
    setSel = el('select', { id: 'set' }, el('option', { value: '' }, 'Choose an assignment…'),

      }).filter((g) => g.children.length));

  const nm = el('input', { type: 'text', id: 'name', placeholder: 'First and last name', autocomplete: 'off' });
  const err = el('div', { class: 'err' });
  const clear = () => (err.textContent = '');
  [per, nm, setSel].forEach((x) => x && x.addEventListener('input', clear));

    el('label', { for: 'name' }, teacher ? "Student's name (as they typed it)" : 'Your name'), nm);

    : 'Type your full name exactly the same way every time. Your questions are made just for you, so your answers won’t match anyone else’s.'));
  card.append(el('button', { class: 'btn', onclick: () => {
    const sk = setSel ? setSel.value : setKey;

    if (norm(name).length < 4 || !name.includes(' ')) return (err.textContent = 'Enter your first and last name.');
    begin(sk, per.value, name, teacher, teacher ? +attSel.value : 1);
  } }, teacher ? 'Show answer key' : 'Start'), err);
  app.append(card);
}

async function begin(setKey, period, name, teacher, teacherAttempt = 1) {
  if (!mathReady) { app.innerHTML = '<div class="card">Loading…</div>'; await mathLoading; }
  document.getElementById('title').textContent = SETS[setKey].title;
  document.getElementById('subtitle').textContent = `${SUBJECTS[SETS[setKey].subject] || ''} · ${name} · ${period} period`;
  const base = `practice:${CONFIG.SALT}:${setKey}:${period}:${norm(name)}`;
  const attempts = setting(setKey, 'attempts'), retries = setting(setKey, 'retries');
  const meta = teacher ? { attempt: teacherAttempt, scores: [] } : store.get(base + ':meta') || { attempt: 1, scores: [] };
  const attempt = Math.min(meta.attempt, attempts);
  const key = attempt > 1 ? `${base}:a${attempt}` : base;
  const { qs, version, seedStr } = generate(setKey, period, name, attempt);
  const saved = teacher ? {} : store.get(key) || {};
  const tries = saved.tries || {};
  Object.keys(tries).forEach((i) => { if (tries[i] > 0 && qs[i]) qs[i] = regenQuestion(seedStr, qs[i], +i, tries[i]); });
  state = { setKey, period, name, qs, version, seedStr, key, base, meta, attempt, attempts, retries, teacher,
    answers: saved.answers || Array(qs.length).fill(null),
    submitted: !teacher && saved.submitted ? saved.submitted : null,
    started: saved.started || Date.now(), tabAways: saved.tabAways || 0,
    tries, status: saved.status || {}, history: saved.history || {}, flash: {}, ai: (!teacher && saved.ai) || {}, proofShown: {},
    drawings: (!teacher && store.get(key + ':draw')) || {}, drawOn: {}, work: (!teacher && store.get(key + ':work')) || {} };
  if (!teacher) { saveState(); store.set(base + ':meta', meta); }
  render();
  startLockdown();
}
function saveState() {
  if (state.teacher) return;
  const saved = store.get(state.key) || {};
  store.set(state.key, { ...saved, answers: state.answers, started: state.started, tabAways: state.tabAways,
    tries: state.tries, status: state.status, history: state.history, submitted: state.submitted, ai: state.ai });
}

function watermarkCss() {

  list.append(el('div', { style: 'display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px' },
    el('button', { class: 'btn secondary', type: 'button', style: 'margin:0;padding:6px 12px;font-size:14px', onclick: () => setAll(true) }, 'Expand all'),
    el('button', { class: 'btn secondary', type: 'button', style: 'margin:0;padding:6px 12px;font-size:14px', onclick: () => setAll(false) }, 'Collapse all')));
  let section = null, secBody = null, subject = null, chapter = null, chKey = null, chBody = null;
  QUESTION_TYPES.forEach((t) => {
    const ch = t.section.split(/[. ]/)[0];
    if (t.subject !== subject) {
      subject = t.subject; chapter = null;
      list.append(el('h2', { style: `margin:${list.querySelector('details') ? '26px' : '6px'} 0 4px;font-size:20px;padding-bottom:6px;border-bottom:2px solid var(--ink, #1d1d1b)` }, SUBJECTS[subject] || subject));
    }
    if (ch !== chapter) {
      chapter = ch; chKey = `chapter:${subject}:${ch}`;
      const name = (CH_TITLES[subject] || {})[ch];
      const F = foldBox(chKey, `Chapter ${ch}${name ? `: ${name}` : ''}`, true);
      chBody = F.body; list.append(F.box);
    }
    if (t.section !== section) {
      section = t.section;
      const F = foldBox(section, section, false);
      secBody = F.body; chBody.append(F.box);
    }
    secs[section].ids.push(t.id); secs[chKey].ids.push(t.id);
    const num = el('input', { type: 'number', min: '0', max: '20', value: String(counts[t.id] || 0), style: 'width:70px;padding:8px;font-size:16px;border:1px solid var(--line);border-radius:8px', 'aria-label': `How many ${t.label}` });
    const prevBox = el('div', { class: 'hidden' });
    let seed = 1;
    const prevBtn = el('button', { class: 'btn secondary', style: 'margin:0;padding:7px 12px;font-size:14px', type: 'button', onclick: () => {
      prevBox.classList.remove('hidden'); prevBox.innerHTML = '';
      const f = prevBtn._fmt ? prevBtn._fmt.value : 'mc';
      prevBox.append(previewQuestion(applyMode(TEMPLATES[t.id](mulberry32(Date.now() % 100000 + seed++)), f === 'both' ? (seed % 2 ? 'mc' : 'fr') : f)));
      prevBtn.textContent = 'Another example';
    } }, 'Preview');
    num.addEventListener('input', () => { counts[t.id] = Math.max(0, Math.min(20, Math.floor(+num.value || 0))); refreshBadges(); update(); });
    const fmtSel = el('select', { 'aria-label': `Format for ${t.label}`, style: 'width:auto;padding:7px 8px;font-size:14px' },
      el('option', { value: 'mc' }, 'Multiple choice'), el('option', { value: 'fr' }, 'Free response'), el('option', { value: 'both' }, 'Some of each'));
    fmtSel.value = formats[t.id] || 'mc';
    const frIn = el('input', { type: 'number', min: '0', max: '20', value: String(frCounts[t.id] ?? 0), 'aria-label': `How many ${t.label} are free response`,
      style: 'width:62px;padding:6px;font-size:15px;border:1px solid var(--line);border-radius:8px' });
    const splitNote = el('span', { class: 'small' });
    const split = el('div', { style: 'flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-left:82px' },
      el('span', { class: 'small' }, 'Free response:'), frIn, splitNote);
    const showSplit = () => {
      split.style.display = fmtSel.value === 'both' ? 'flex' : 'none';
      const n = counts[t.id] || 0, fr = Math.min(n, frCounts[t.id] || 0);
      splitNote.textContent = `→ ${n - fr} multiple choice + ${fr} free response`;
    };
    fmtSel.addEventListener('input', () => { formats[t.id] = fmtSel.value; showSplit(); update(); });
    frIn.addEventListener('input', () => { frCounts[t.id] = Math.max(0, Math.min(20, Math.floor(+frIn.value || 0))); showSplit(); update(); });
    num.addEventListener('input', showSplit);
    showSplit();
    secBody.append(el('div', { style: 'display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap' },
      num, el('div', { style: 'flex:1;min-width:180px' }, el('div', { style: 'font-weight:600' }, t.label), el('div', { class: 'small' }, t.desc)),
      t.writtenOnly ? el('span', { class: 'small', style: 'padding:7px 8px' }, 'Written proof') : fmtSel, prevBtn, t.writtenOnly ? '' : split), prevBox);
    prevBtn._fmt = fmtSel;
  });
  Object.entries(secs).forEach(([sec, S]) => { S.box.open = openSaved[sec] ?? S.ids.some((id) => counts[id] > 0); });
  refreshBadges();
  app.append(list);

  const linkIn = el('input', { type: 'text', readonly: 'readonly', style: 'font-size:14px' });
  const keyLink = el('a', { target: '_blank', rel: 'noopener' }, 'Open the answer key for this assignment');
  const tryLink = el('a', { target: '_blank', rel: 'noopener' }, 'Try it as a student');
  const codeOut = el('code', { style: 'display:block;white-space:pre-wrap;word-break:break-all;padding:8px;margin-top:6px;font-size:12px' });
  const msg = el('div', { class: 'err' });
  const copyBtn = el('button', { class: 'btn', type: 'button', onclick: async () => {
    if (!linkIn.value) return;
    try { await navigator.clipboard.writeText(linkIn.value); copyBtn.textContent = 'Copied!'; }
    catch { linkIn.select(); copyBtn.textContent = 'Press Ctrl+C to copy'; }
    setTimeout(() => (copyBtn.textContent = 'Copy link'), 1800);
  } }, 'Copy link');
  const out = el('div', { class: 'card' },
    el('div', {}, 'Total questions: ', totalEl), msg,
    el('label', {}, 'Student link (post this in Google Classroom)'), linkIn, copyBtn,
    el('p', { class: 'small', style: 'margin-top:14px' }, tryLink, ' · ', keyLink),
    el('details', { style: 'margin-top:10px' }, el('summary', { class: 'small' }, 'Make it a permanent menu item (optional)'),
      el('p', { class: 'small' }, 'Paste this line inside SETS near the top of practice.html to add it to the assignment menu:'), codeOut));
  app.append(out);
  [titleIn, subjSel, orderSel, retriesIn, attemptsIn].forEach((x) => x.addEventListener('input', update));
  lockIn.addEventListener('change', update);
  sameIn.addEventListener('change', update);

  function update() {
    const items = [];
    QUESTION_TYPES.filter((t) => counts[t.id] > 0).forEach((t) => {
      const n = counts[t.id], f = t.writtenOnly ? 'mc' : formats[t.id];
      if (f === 'both') { // multiple-choice ones first, then free response
        const fr = Math.min(n, frCounts[t.id] || 0);
        if (n - fr > 0) items.push([t.id, n - fr, 'mc']);
        if (fr > 0) items.push([t.id, fr, 'fr']);
      } else items.push([t.id, n, f === 'fr' ? 'fr' : 'mc']);
    });
    const total = items.reduce((a, [, n]) => a + n, 0);
    totalEl.textContent = String(total);
    const title = titleIn.value.trim() || 'Custom Practice';
    store.set('builder:last', { counts, formats, frCounts, title: titleIn.value, subject: subjSel.value, order: orderSel.value, retries: +retriesIn.value || 0, attempts: +attemptsIn.value || 1, lockdown: lockIn.checked, same: sameIn.checked });
    if (!total) { linkIn.value = ''; msg.textContent = 'Choose at least one question.'; [tryLink, keyLink].forEach((a) => a.removeAttribute('href')); codeOut.textContent = ''; return; }
    msg.textContent = total > 40 ? 'That’s a lot of questions — students may need extra time.' : '';
    const q = new URLSearchParams();
    q.set('mix', items.map(([id, n, f]) => `${id}.${n}${f === 'fr' ? '.fr' : ''}`).join('_'));
    q.set('title', title); q.set('subject', subjSel.value);
    if (orderSel.value === 'mixed') q.set('order', 'mixed');
    const rt = Math.max(0, Math.min(5, Math.floor(+retriesIn.value || 0))), at = Math.max(1, Math.min(10, Math.floor(+attemptsIn.value || 1)));
    if (rt) q.set('retries', String(rt));
    if (at > 1) q.set('attempts', String(at));
    if (!lockIn.checked) q.set('lock', '0');
    if (sameIn.checked) q.set('same', '1');
    const url = location.origin + location.pathname + '?' + q.toString();
    linkIn.value = url; tryLink.href = url; keyLink.href = url + '&teacher=1';
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'custom';
    codeOut.textContent = `'${slug}': { subject: '${subjSel.value}', title: '${title.replace(/'/g, "\\'")}', items: [${items.map(([id, n, f]) => `['${id}', ${n}${f === 'fr' ? ", 'fr'" : ''}]`).join(', ')}]${orderSel.value === 'mixed' ? ', shuffle: true' : ''}${rt ? `, retries: ${rt}` : ''}${at > 1 ? `, attempts: ${at}` : ''}${lockIn.checked ? '' : ', lockdown: false'}${sameIn.checked ? ', same: true' : ''} },`;
  }
  update();
}

function previewQuestion(q) {
  const W = contentWidth() - 20;
  const box = el('div', { class: 'q', style: 'margin:6px 0 12px' });
  box.append(textCanvas(q.stem, W));
  if (q.draw) {
    const graph = q.topic.startsWith('Graphs');
    const cv = q.size ? makeCanvas(q.size[0], q.size[1]) : makeCanvas(graph ? 620 : 560, graph ? 330 : 300);
    cv.classList.add('diagram'); q.draw(cv); box.append(cv);
  }
  if (q.mode === 'fr') {
    box.append(el('div', { class: 'fr' }, el('div', { class: 'frrow' }, ...q.fr.fields.map((f) => el('label', { class: 'frfield', style: f.part ? 'flex-basis:100%' : '' },
      f.part ? el('span', { class: 'frpart', style: 'margin:6px 8px 0 0' }, f.part) : '',
      f.label ? el('span', { class: 'frlabel' }, f.label) : '', f.prefix ? el('span', { class: 'frprefix' }, f.prefix) : '',
      f.kind === 'choice' ? el('span', { class: 'small' }, f.options.map((o, j) => `${LETTERS[j]}. ${o}`).join('   ')) :
      f.kind === 'select' ? el('select', { disabled: 'disabled' }, el('option', {}, 'Choose…')) : f.kind === 'proof' ? el('span', { class: 'small' }, 'Students type the proof one line at a time; each line is checked, then the AI grades it.') : el('input', { disabled: 'disabled', class: f.kind === 'number' ? 'num' : 'let' }),
      f.suffix ? el('span', { class: 'frprefix' }, f.suffix) : ''))),
      el('div', { class: 'small', style: 'margin-top:6px' }, 'Correct answer: ', el('strong', {}, q.fr.display.replace(/(.)\u0305/g, '$1')))), el('div', { class: 'sol' }, q.solution));
    return box;
  }
  const ch = el('div', { class: 'choices' });
  q.choices.forEach((c, j) => ch.append(el('div', { class: 'choice' + (j === q.answer ? ' right' : '') }, el('span', { class: 'letter' }, LETTERS[j]), textCanvas(c, Math.min(W - 70, 500), '17px Georgia, "Times New Roman", serif', 24))));
  box.append(ch, el('div', { class: 'sol' }, q.solution));
  return box;
}

/* ---------- entry ---------- */
(function init() {
  lastW = app.clientWidth;
  if (params.has('makehash')) {
    app.append(el('div', { class: 'card' }, el('p', {}, 'Paste this into TEACHER_PIN_HASH:'), el('p', {}, el('code', {}, String(cyrb53(params.get('makehash')))))));
    return;
  }
  if (params.has('teacher')) {
    document.getElementById('title').textContent = 'Teacher tools';
    const pin = el('input', { type: 'password', placeholder: 'Teacher PIN' });
    const err = el('div', { class: 'err' });
    app.append(el('div', { class: 'card' }, el('label', {}, 'Teacher PIN'), pin,
      el('button', { class: 'btn', onclick: () => {
        if (String(cyrb53(pin.value)) === CONFIG.TEACHER_PIN_HASH) teacherMenu(); else err.textContent = 'Wrong PIN.';
      } }, 'Continue'), err));
    pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') app.querySelector('.btn').click(); });
    return;
  }
  startScreen(false);
})();

window.__practice = { TEMPLATES, generate, SETS, mulberry32, cyrb53 }; // used for testing
</script>
